name: CI

on:
  push:
    branches: [ 'master', 'ci/**' ]
  pull_request: {}

jobs:
  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Check workspace release versions
      run: node scripts/release-version.mjs check

    - name: Install pinned license tools
      run: |
        cargo install --locked cargo-about --version 0.9.1 --features cli
        cargo install --locked cargo-deny --version 0.20.2

    - name: Fetch locked dependencies
      run: cargo fetch --locked

    - name: Check dependency license policy
      run: cargo deny --workspace --config licenses/deny.toml --locked check licenses

    - name: Check shipped notice reports
      run: |
        cargo about generate --workspace --offline --config licenses/about.toml --locked --fail licenses/about.hbs -o /tmp/THIRD_PARTY_LICENSES.html
        diff -u licenses/THIRD_PARTY_LICENSES.html /tmp/THIRD_PARTY_LICENSES.html
        node scripts/generate-supplemental-third-party-notices.mjs /tmp/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt
        diff -u licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt /tmp/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt

    - name: Check workspace license files
      run: |
        # Workspace crates keep a local license copy so source distributions
        # remain self-contained; GitHub Release archives ship the root license
        # and third-party notices.
        for member in mj-core mj-agents mj-anvil mj-tui mj-remote mj-desktop voice-worker; do
          diff -u LICENSE "$member/LICENSE"
        done

  belgr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      id: toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: rustfmt, clippy

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install Linux native dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes libasound2-dev libwebkit2gtk-4.1-dev

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-belgr-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-belgr-cargo-${{ steps.toolchain.outputs.cachekey }}-
          ${{ runner.os }}-belgr-cargo-

    - name: Check Rust formatting
      run: cargo fmt --check

    - name: Run Clippy lints
      run: cargo clippy --all-targets -- -D warnings

    # `mj-desktop` is linked into the default desktop binary but remains outside
    # the default workspace members, so its own test targets need this gate.
    - name: Lint desktop crate
      run: cargo clippy -p belgr-mj-desktop --all-targets -- -D warnings

    - name: Build belgr
      run: cargo build --release

    - name: Run tests
      run: cargo test

    - name: Test desktop crate
      run: cargo test -p belgr-mj-desktop

    - name: Verify packaged macOS desktop crate
      if: runner.os == 'macOS'
      run: cargo package --locked --allow-dirty -p belgr-mj-desktop

  voice-worker:
    name: Voice worker (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: clippy

    - name: Install Linux audio dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes libasound2-dev

    - name: Check voice worker
      run: cargo clippy -p belgr-mj-voice-worker --all-targets -- -D warnings

    - name: Test voice worker
      run: cargo test -p belgr-mj-voice-worker

  android:
    name: Android aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        targets: aarch64-linux-android
        components: clippy

    # mj-anvil is out of the workspace default-members (it only ships in the
    # Android binary), so the host matrix job never builds it; its lint and
    # test gate lives here instead.
    - name: Lint Anvil crate
      run: cargo clippy --locked -p belgr-mj-anvil --all-targets -- -D warnings

    - name: Test Anvil crate
      run: cargo test --locked -p belgr-mj-anvil

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27d

    - name: Export Android NDK toolchain
      shell: bash
      run: |
        ndk_path='${{ steps.setup-ndk.outputs.ndk-path }}'
        echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ndk_path" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
        echo "CC_aarch64_linux_android=$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
        echo "AR_aarch64_linux_android=$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

    - name: Check Android target
      run: cargo check --locked --no-default-features --target aarch64-linux-android
